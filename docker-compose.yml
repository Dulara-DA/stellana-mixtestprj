services:
  postgres:
    image: postgres:16-alpine
    container_name: stellana-mixing-postgres
    environment:
      POSTGRES_DB: stellana_mixing
      POSTGRES_USER: stellana
      POSTGRES_PASSWORD: stellana_dev
    ports:
      - "5432:5432"
    volumes:
      - stellana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellana -d stellana_mixing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stellana_postgres_data:

