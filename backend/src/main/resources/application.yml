debug: false

spring:
  application:
    name: stellana-mixing-tracker
  datasource:
    url: jdbc:h2:file:./data/stellana-mixing;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Colombo
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Colombo
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Port 5173 is the Vite development server used for laptop/tablet testing.
    # Restrict this to the deployed HTTPS hostname outside development.
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://*:[5173]}"
  jwt:
    secret: ${JWT_SECRET:stellana-development-jwt-secret-change-this-before-production-2026}
    expiration-minutes: 480
  frontend-url: http://localhost:5173
  traceability-base-url: http://localhost:5173/trace
  production:
    mixer-capacity-kg: 240
    fill-factor: 0.7
    fill-factor-enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
